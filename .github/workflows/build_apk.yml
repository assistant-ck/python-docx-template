name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如: v0.4.0)'
        required: true
        type: string
      release_notes:
        description: '版本更新说明'
        required: false
        type: string
      flutter_version:
        description: 'Flutter 版本（需与客户端项目验收版本一致）'
        required: false
        default: '3.47.5'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag_name }}
      FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.5' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          echo "AGP declared in project:"
          grep -n "com.android.application" android/settings.gradle.kts || true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${KEYSTORE_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"

          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APKs for each architecture
        run: |
          set -euo pipefail
          mkdir -p release-packages

          # 依赖仓库（aliyun 镜像 / Maven Central）偶发 5xx，重试整个构建步骤。
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if flutter build apk --release --split-per-abi; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::flutter build apk 连续 3 次失败，请查看上方 Gradle 输出"
              exit 1
            fi
            echo "构建失败，等待 20s 后重试（多为 maven 镜像临时 5xx）"
            sleep 20
          done

          for ABI in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$ABI-release.apk" \
              "release-packages/jf-app-$RELEASE_TAG-android-$ABI.apk"
          done

      - name: Build universal APK
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::通用包构建失败"
              exit 1
            fi
            sleep 20
          done
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-packages/jf-app-$RELEASE_TAG-android-universal.apk"

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          body: ${{ inputs.release_notes }}
          files: release-packages/*.apk
          fail_on_unmatched_files: true
