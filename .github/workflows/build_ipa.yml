name: Build IPA

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如: v0.4.0)'
        required: true
        type: string
      release_notes:
        description: '版本更新说明'
        required: false
        type: string
      flutter_version:
        description: 'Flutter 版本（需与客户端项目验收版本一致）'
        required: false
        default: '3.47.5'
        type: string

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      RELEASE_TAG: ${{ inputs.tag_name }}
      FLUTTER_VERSION: ${{ inputs.flutter_version || '3.47.5' }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.GpEx.8KIR7' }}

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          echo "Target bundle id: $BUNDLE_ID"
          echo "Project bundle id:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER = " ios/Runner.xcodeproj/project.pbxproj || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter iOS release artifacts
        run: flutter build ios --release --no-codesign

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          : "${BUILD_CERTIFICATE_BASE64:?IOS_CERTIFICATE is required}"
          : "${BUILD_PROVISION_PROFILE_BASE64:?IOS_PROVISIONING_PROFILE is required}"

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')
          : "${SIGNING_IDENTITY:?No valid signing identity with a private key was found in IOS_CERTIFICATE}"

          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PP_PATH" "$PROFILE_DIR/$PP_UUID.mobileprovision"

          # 先把描述文件里的 App ID 打出来，Bundle ID 不一致时立刻失败并说明原因。
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          echo "Profile application-identifier: $PROFILE_APP_ID"
          echo "Workflow BUNDLE_ID: $BUNDLE_ID"
          case "$PROFILE_APP_ID" in
            *".$BUNDLE_ID"|*'.*')
              echo "描述文件 App ID 与 BUNDLE_ID 兼容（通配 App ID 也算通过）"
              ;;
            *)
              echo "::error::描述文件的 App ID ($PROFILE_APP_ID) 与 BUNDLE_ID ($BUNDLE_ID) 不匹配。"
              echo "::error::请更换 IOS_PROVISIONING_PROFILE，或在仓库 Variables 里把 IOS_BUNDLE_ID 设为描述文件对应的 App ID。"
              exit 1
              ;;
          esac

          printf 'SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          printf 'PP_UUID=%s\n' "$PP_UUID" >> "$GITHUB_ENV"

      - name: Build and export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${IOS_EXPORT_METHOD:?IOS_EXPORT_METHOD is required}"
          : "${BUNDLE_ID:?BUNDLE_ID is required}"
          cd ios

          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          export ARCHIVE_PATH KEYCHAIN_PATH

          gem install --user-install xcodeproj --version 1.27.0 --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Runner.xcodeproj')
          target = project.targets.find { |item| item.name == 'Runner' }
          raise 'Runner target was not found' unless target
          config = target.build_configurations.find { |item| item.name == 'Release' }
          raise 'Runner Release configuration was not found' unless config
          settings = config.build_settings
          settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('BUNDLE_ID')
          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['CODE_SIGN_IDENTITY'] = ENV.fetch('SIGNING_IDENTITY')
          settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ENV.fetch('SIGNING_IDENTITY')
          settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
          settings['PROVISIONING_PROFILE'] = ENV.fetch('PP_UUID')
          settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PP_UUID')
          settings['OTHER_CODE_SIGN_FLAGS'] = "$(inherited) --keychain #{ENV.fetch('RUNNER_TEMP')}/app-signing.keychain-db"
          project.save
          puts "PRODUCT_BUNDLE_IDENTIFIER => #{settings['PRODUCT_BUNDLE_IDENTIFIER']}"
          RUBY

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$IOS_EXPORT_METHOD</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PP_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            ONLY_ACTIVE_ARCH=NO

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

      - name: Rename IPA
        run: |
          mkdir -p release-packages
          set -- ios/build/ipa/*.ipa
          [ "$#" -eq 1 ]
          cp "$1" "release-packages/jf-app-$RELEASE_TAG-ios.ipa"

      - name: Upload IPA to Private Repo Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          tag_name: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          body: ${{ inputs.release_notes }}
          files: release-packages/*.ipa
          fail_on_unmatched_files: true

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
