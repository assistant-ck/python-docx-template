name: Build IPA

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本标签 (例如: v0.0.2)'
        required: true
        type: string
      release_notes:
        description: '版本更新说明'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.inputs.tag_name }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter iOS release artifacts
        run: flutter build ios --release --no-codesign

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          : "${BUILD_CERTIFICATE_BASE64:?IOS_CERTIFICATE is required}"
          : "${BUILD_PROVISION_PROFILE_BASE64:?IOS_PROVISIONING_PROFILE is required}"

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/^[[:space:]]*[0-9]+\)/ {print $2; exit}')
          : "${SIGNING_IDENTITY:?No valid signing identity with a private key was found in IOS_CERTIFICATE}"

          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PP_PATH" "$PROFILE_DIR/$PP_UUID.mobileprovision"

          printf 'SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          printf 'PP_UUID=%s\n' "$PP_UUID" >> "$GITHUB_ENV"

      - name: Build and export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          : "${IOS_EXPORT_METHOD:?IOS_EXPORT_METHOD is required}"
          cd ios

          BUNDLE_ID="com.GpEx.8KIR7"
          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          gem install --user-install xcodeproj --version 1.27.0 --no-document
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('Runner.xcodeproj')
          target = project.targets.find { |item| item.name == 'Runner' }
          raise 'Runner target was not found' unless target
          config = target.build_configurations.find { |item| item.name == 'Release' }
          raise 'Runner Release configuration was not found' unless config
          settings = config.build_settings
          settings['CODE_SIGN_STYLE'] = 'Manual'
          settings['CODE_SIGN_IDENTITY'] = ENV.fetch('SIGNING_IDENTITY')
          settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ENV.fetch('SIGNING_IDENTITY')
          settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
          settings['PROVISIONING_PROFILE'] = ENV.fetch('PP_UUID')
          settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PP_UUID')
          settings['OTHER_CODE_SIGN_FLAGS'] = "$(inherited) --keychain #{ENV.fetch('RUNNER_TEMP')}/app-signing.keychain-db"
          project.save
          RUBY

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$IOS_EXPORT_METHOD</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>$SIGNING_IDENTITY</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PP_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            ONLY_ACTIVE_ARCH=NO

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA to Private Repo Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }} 
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}    
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          body: ${{ github.event.inputs.release_notes }}
          files: ios/build/ipa/*.ipa
          fail_on_unmatched_files: true

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
